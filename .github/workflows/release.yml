# Builds signed release APKs and publishes them on GitHub Releases.
# Triggers:
#  - change the VERSION file on main: releases v<VERSION> if it is not released yet
#  - push a tag like v1.2.3
#  - run it manually with a tag name (the tag is created at the branch head on publish)
#
# A release is only published when every APK is signed with the Meshwise release key
# (checked against EXPECTED_CERT_SHA256 below). Without the signing secrets the run fails,
# unless "test build" is ticked: then the APKs are only attached to the run as an artifact.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0 (created at the selected branch's head if missing)"
        required: true
      test_build:
        description: "Test build: no release, allow a temporary key, APKs as a run artifact"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME"
          else TAG="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $TAG"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  occt:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/occt.yml

  release:
    name: Build and publish
    needs: [version, occt]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      TEST_BUILD: ${{ github.event.inputs.test_build == 'true' }}
      # Public fingerprint of the Meshwise release certificate (CN=Meshwise, O=doesthings).
      EXPECTED_CERT_SHA256: cbefeb0e767375be72d29325f97ec602b4b5d9b8e4eecb9aef3958818bbc5c38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore OCCT
        uses: ./.github/actions/restore-occt
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Tolerate how the secret was pasted: Windows line endings, wrapped lines, spaces,
            # and "-----BEGIN/END ...-----" lines (certutil). The certificate check below
            # still decides whether anything is published.
            CLEAN=$(printf '%s\n' "$KEYSTORE_BASE64" | tr -d '\r' | grep -v -- '-----' | tr -d ' \t\n')
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
              BAD=$(printf '%s' "$CLEAN" | tr -d 'A-Za-z0-9+/=' | wc -c)
              echo "::error::SIGNING_KEYSTORE_BASE64 is not valid base64 (${#CLEAN} characters after cleanup, $BAD outside the base64 alphabet). Re-create it with 'base64 -w0 release.jks' and paste it again."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "::error::The keystore decoded ($(wc -c < "$RUNNER_TEMP/release.jks") bytes) but could not be opened with SIGNING_STORE_PASSWORD and SIGNING_KEY_ALIAS. Check those two secrets (keytool -list -keystore release.jks shows the alias)."
              exit 1
            fi
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository release key."
          elif [ "$TEST_BUILD" = "true" ]; then
            echo "::warning::No signing secrets: test build signed with a temporary key."
          else
            echo "::error::Signing secrets are missing. Add SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD under Settings > Secrets and variables > Actions (see docs/RELEASING.md), then re-run this workflow."
            exit 1
          fi

      - name: Build release APKs
        run: |
          VERSION="${TAG#v}"
          ./gradlew assembleRelease -Pfsv.versionName="$VERSION"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "dist/Meshwise-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Verify signatures
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for f in dist/*.apk; do
            CERT=$("$APKSIGNER" verify --print-certs "$f" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            echo "$(basename "$f"): $CERT"
            if [ "$CERT" != "$EXPECTED_CERT_SHA256" ] && [ "$TEST_BUILD" != "true" ]; then
              echo "::error::$(basename "$f") is not signed with the Meshwise release key."
              exit 1
            fi
          done

      - name: Upload test build
        if: env.TEST_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meshwise-test-build
          path: dist/

      - name: Release notes
        if: env.TEST_BUILD != 'true'
        run: |
          VERSION="${TAG#v}"
          if [ -f "docs/release-notes/$TAG.md" ]; then cp "docs/release-notes/$TAG.md" notes.md; else echo "Meshwise $VERSION" > notes.md; fi
          cat >> notes.md <<'NOTES'

          ### Which APK do I need?
          | File | Devices |
          |---|---|
          | `…-arm64-v8a.apk` | Almost every phone and tablet from the last ~8 years (**pick this one if unsure**) |
          | `…-armeabi-v7a.apk` | Older 32-bit ARM devices |
          | `…-x86_64.apk` | Chromebooks and emulators |
          | `…-universal.apk` | Everything (largest download) |

          ### Verify the download
          Every APK is signed with the Meshwise release certificate. You can check it with
          `apksigner verify --print-certs <file>.apk`. The SHA-256 must be:
          ```
          CB:EF:EB:0E:76:73:75:BE:72:D2:93:25:F9:7E:C6:02:B4:B5:D9:B8:E4:EE:CB:9A:EF:39:58:81:8B:BC:5C:38
          ```
          File checksums are in `SHA256SUMS.txt`.
          NOTES

      - name: Publish
        if: env.TEST_BUILD != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Meshwise ${{ env.TAG }}
          body_path: notes.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
