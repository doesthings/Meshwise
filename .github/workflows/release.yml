# Builds signed release APKs and publishes them on GitHub Releases.
# Triggers:
#  - change the VERSION file on main: releases v<VERSION> if it is not released yet
#  - push a tag like v1.2.3
#  - run it manually with a tag name (the tag is created at the branch head on publish)
#
# A release is only published when every APK is signed with the Meshwise release key
# (checked against EXPECTED_CERT_SHA256 below). Without the signing secrets the run fails,
# unless "test build" is ticked: then the APKs are only attached to the run as an artifact.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0 (created at the selected branch's head if missing)"
        required: true
      test_build:
        description: "Test build: no release, allow a temporary key, APKs as a run artifact"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME"
          else TAG="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "branch" ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $TAG"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  occt:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/occt.yml

  release:
    name: Build and publish
    needs: [version, occt]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.tag }}
      TEST_BUILD: ${{ github.event.inputs.test_build == 'true' }}
      # Public fingerprint of the Meshwise release certificate (CN=Meshwise, O=doesthings).
      EXPECTED_CERT_SHA256: 69fe7fdd7748c2faddbef43c66bc8becf719aaaccdd340de42f7f3eb314b4d11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore OCCT
        uses: ./.github/actions/restore-occt
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6" "build-tools;36.0.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Tolerate how the secret was pasted: line endings, wrapping, spaces, invisible
            # characters (BOM, zero-width space) and "-----BEGIN/END ...-----" lines (certutil).
            # Opening the keystore and the certificate check below still guard the release.
            CLEAN=$(printf '%s\n' "$KEYSTORE_BASE64" | tr -d '\r' | grep -v -- '-----' | tr -cd 'A-Za-z0-9+/=')
            DROPPED=$(( $(printf '%s' "$KEYSTORE_BASE64" | wc -c) - ${#CLEAN} ))
            if [ "$DROPPED" -gt 0 ]; then echo "Ignored $DROPPED stray bytes (whitespace or invisible characters) in SIGNING_KEYSTORE_BASE64."; fi
            if ! printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
              echo "::error::SIGNING_KEYSTORE_BASE64 is not valid base64 (${#CLEAN} base64 characters). Re-create it with 'base64 -w0 release.jks' and paste it again."
              exit 1
            fi
            # Same for the other secrets: drop a BOM, zero-width spaces, line breaks and
            # surrounding spaces.
            tidy() { printf '%s' "$1" | sed -e 's/\xef\xbb\xbf//g; s/\xe2\x80\x8b//g' | tr -d '\r\n' | sed -e 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
            STORE_PASSWORD=$(tidy "$STORE_PASSWORD"); KEY_PASSWORD=$(tidy "$KEY_PASSWORD"); KEY_ALIAS=$(tidy "$KEY_ALIAS")
            KS="$RUNNER_TEMP/release.jks"
            if ! keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
              if [ -n "$KEY_PASSWORD" ] && keytool -list -keystore "$KS" -storepass "$KEY_PASSWORD" > /dev/null 2>&1; then
                echo "::warning::SIGNING_KEY_PASSWORD opens the keystore but SIGNING_STORE_PASSWORD does not; the two look swapped. Using it for both."
                STORE_PASSWORD="$KEY_PASSWORD"
              else
                WHY=$(keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" 2>&1 | grep -i 'keytool error' | head -1)
                echo "::error::The keystore decoded ($(wc -c < "$KS") bytes, $(file -b "$KS" | cut -c1-40)) but SIGNING_STORE_PASSWORD does not open it. keytool says: $WHY"
                exit 1
              fi
            fi
            ALIASES=$(keytool -list -v -keystore "$KS" -storepass "$STORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p')
            if ! printf '%s\n' "$ALIASES" | grep -qixF -- "$KEY_ALIAS"; then
              if [ "$(printf '%s\n' "$ALIASES" | grep -c .)" -eq 1 ]; then
                echo "::warning::SIGNING_KEY_ALIAS does not match the key in the keystore; using its only key."
                KEY_ALIAS="$ALIASES"
              else
                echo "::error::SIGNING_KEY_ALIAS does not match any of the $(printf '%s\n' "$ALIASES" | grep -c .) keys in the keystore."
                exit 1
              fi
            fi
            # The key password must unlock the private key. In a PKCS12 keystore it is always
            # the store password (and keytool ignores -keypass), so use that.
            if keytool -list -keystore "$KS" -storepass "$STORE_PASSWORD" 2>/dev/null | grep -qi '^Keystore type: PKCS12'; then
              if [ "$KEY_PASSWORD" != "$STORE_PASSWORD" ]; then echo "PKCS12 keystore: signing with the store password as the key password."; fi
              KEY_PASSWORD="$STORE_PASSWORD"
            elif ! keytool -certreq -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /dev/null 2>&1; then
              if keytool -certreq -keystore "$KS" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$STORE_PASSWORD" > /dev/null 2>&1; then
                echo "::warning::SIGNING_KEY_PASSWORD does not unlock the key, but the store password does; using that."
                KEY_PASSWORD="$STORE_PASSWORD"
              else
                echo "::error::SIGNING_KEY_PASSWORD does not unlock the key. Check that secret."
                exit 1
              fi
            fi
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Signing with the repository release key."
          elif [ "$TEST_BUILD" = "true" ]; then
            echo "::warning::No signing secrets: test build signed with a temporary key."
          else
            echo "::error::Signing secrets are missing. Add SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD under Settings > Secrets and variables > Actions (see docs/RELEASING.md), then re-run this workflow."
            exit 1
          fi

      - name: Build release APKs
        run: |
          VERSION="${TAG#v}"
          ./gradlew assembleRelease -Pfsv.versionName="$VERSION"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed -e 's/^app-//' -e 's/-release$//')
            cp "$f" "dist/Meshwise-$VERSION-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Verify signatures
        run: |
          # A pinned apksigner: the newest one on the runner printed no certificate.
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for f in dist/*.apk; do
            OUT=$("$APKSIGNER" verify --print-certs "$f" 2>&1) || { echo "$OUT"; echo "::error::$(basename "$f") does not verify."; exit 1; }
            CERT=$(printf '%s\n' "$OUT" | grep -oiE 'certificate SHA-256 digest: [0-9a-f]{64}' | head -1 | awk '{print tolower($NF)}')
            echo "$(basename "$f"): ${CERT:-<none>}"
            if [ -z "$CERT" ]; then
              echo "$OUT"
              echo "::error::Could not read the signing certificate of $(basename "$f")."
              exit 1
            fi
            if [ "$CERT" != "$EXPECTED_CERT_SHA256" ] && [ "$TEST_BUILD" != "true" ]; then
              echo "::error::$(basename "$f") is not signed with the Meshwise release key."
              exit 1
            fi
          done

      - name: Upload test build
        if: env.TEST_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meshwise-test-build
          path: dist/

      - name: Release notes
        if: env.TEST_BUILD != 'true'
        run: |
          VERSION="${TAG#v}"
          if [ -f "docs/release-notes/$TAG.md" ]; then cp "docs/release-notes/$TAG.md" notes.md; else echo "Meshwise $VERSION" > notes.md; fi
          cat >> notes.md <<'NOTES'

          ### Which APK do I need?
          | File | Devices |
          |---|---|
          | `…-arm64-v8a.apk` | Almost every phone and tablet from the last ~8 years (**pick this one if unsure**) |
          | `…-armeabi-v7a.apk` | Older 32-bit ARM devices |
          | `…-x86_64.apk` | Chromebooks and emulators |
          | `…-universal.apk` | Everything (largest download) |

          ### Verify the download
          Every APK is signed with the Meshwise release certificate. You can check it with
          `apksigner verify --print-certs <file>.apk`. The SHA-256 must be:
          ```
          69:FE:7F:DD:77:48:C2:FA:DD:BE:F4:3C:66:BC:8B:EC:F7:19:AA:AC:CD:D3:40:DE:42:F7:F3:EB:31:4B:4D:11
          ```
          File checksums are in `SHA256SUMS.txt`.
          NOTES

      - name: Publish
        if: env.TEST_BUILD != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Meshwise ${{ env.TAG }}
          body_path: notes.md
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
