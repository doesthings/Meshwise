name: Restore OCCT
description: Restores the cached Open CASCADE builds produced by the OCCT workflow.
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@v4
      with:
        path: third_party/occt/arm64-v8a
        key: occt-V7_8_1-arm64-v8a-${{ hashFiles('scripts/build-occt-android.sh') }}
        fail-on-cache-miss: true
    - uses: actions/cache/restore@v4
      with:
        path: third_party/occt/armeabi-v7a
        key: occt-V7_8_1-armeabi-v7a-${{ hashFiles('scripts/build-occt-android.sh') }}
        fail-on-cache-miss: true
    - uses: actions/cache/restore@v4
      with:
        path: third_party/occt/x86_64
        key: occt-V7_8_1-x86_64-${{ hashFiles('scripts/build-occt-android.sh') }}
        fail-on-cache-miss: true
